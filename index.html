/** After a stock error: drop items that are gone and lower quantities to what is left. */
function syncCheckoutToStock() {
  const co = state.checkout;
  const before = JSON.stringify(co.items);
  co.items = co.items
    .map(i => {
      const p = productById(i.id);
      return canBuy(p) ? { id: i.id, qty: Math.min(i.qty, p.stock_quantity) } : null;
    })
    .filter(Boolean);
  if (!co.items.length) {
    closeSheet('checkout-sheet');
    return;
  }
  co.adjusted = JSON.stringify(co.items) !== before;
  refreshCheckoutTotals();
  if (co.adjusted) $('#checkout-sheet .sheet__body').scrollTo({ top: 0, behavior: 'smooth' });   // show the updated items
}
function setFieldError(form, name, on) {
  const field = $(`[data-field="${name}"]`, form);
  if (field) field.classList.toggle('has-error', on);
  return on;
}
async function confirmOrder(btn) {
  const co = state.checkout;
  if (co.busy) return;
  const form = $('#checkout-form');
  const v = name => form[name].value.trim();
  const phoneDigits = v('phone').replace(/\D/g, '');

  // 1. Check the form, show each message next to its field
  const zoneMissing = !co.zoneId;
  $('#zone-choices').classList.toggle('has-error', zoneMissing);
  $('#zone-error').style.display = zoneMissing ? 'block' : '';
  const problems = [
    setFieldError(form, 'name', !v('name')),
    setFieldError(form, 'phone', phoneDigits.length < 9 || phoneDigits.length > 12),
    setFieldError(form, 'address', !v('address')),
    setFieldError(form, 'postcode', !/^\d{5}$/.test(v('postcode'))),
    setFieldError(form, 'city', !v('city')),
    setFieldError(form, 'state', !v('state')),
    setFieldError(form, 'email', v('email') !== '' && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v('email')))
  ];
  if (zoneMissing || problems.some(Boolean)) {
    const first = zoneMissing ? $('#zone-choices') : $('.field.has-error', form);
    first.scrollIntoView({ behavior: 'smooth', block: 'center' });
    if (!zoneMissing) $('.input', first).focus({ preventScroll: true });
    return toast('Please complete the highlighted fields.', 'error');
  }

  // 2. Send ONLY customer details, the region and { product, quantity }.
  //    Prices, shipping fee and total are worked out by the database.
  co.busy = true;
  setBusy(btn, true, 'Placing your order…');
  const { data, error } = await sb.rpc('create_order', {
    p_customer: {
      name: v('name'), phone: v('phone'), email: v('email'), address: v('address'),
      postcode: v('postcode'), city: v('city'), state: v('state'), notes: v('notes')
    },
    p_shipping_zone_id: co.zoneId,
    p_items: co.items.map(i => ({ product_id: i.id, quantity: i.qty }))
  });
  co.busy = false;

  if (error || !data) {
    setBusy(btn, false);
    // P0001 = a message written for customers by the database function (sold out, store closed, ...)
    const friendly = error && error.code === 'P0001';
    if (!friendly) console.error(error);
    toast(friendly ? error.message : 'We could not place your order. Check your connection and try again.', 'error');
    if (friendly) {
      // Stock or prices probably changed: refresh so the screen matches reality
      try { await loadProducts(); renderCatalog(); tidyCart(); syncCheckoutToStock(); } catch (e) { /* keep the form as it is */ }
    }
    return;
  }

  // 3. Success
  if (co.fromCart) { state.cart = []; saveCart(); }
  writeStore(LAST_ORDER_KEY, { number: data.order_number, phone: v('phone') });
  closeSheet('checkout-sheet', true);
  showOrderReceived(data);
  loadProducts().then(() => { renderCatalog(); renderCartBadges(); }).catch(() => {});
}

    ta.value = text;

/* ----- Upload payment receipt (orders that still need paying) -----
 * The customer has no login, so the database controls every step:
 *   1. request_receipt_upload  — checks order number + phone, hands out ONE upload slot
 *   2. upload into that slot   — private bucket; a visitor cannot read, list or replace files
 *   3. submit_payment_receipt  — checks order number + phone again, attaches the file
 * This page never writes to the orders table.
 */
const RECEIPT_MAX_BYTES = 5 * 1024 * 1024;
const RECEIPT_TYPE_OF = { jpg: 'image/jpeg', jpeg: 'image/jpeg', png: 'image/png', webp: 'image/webp', pdf: 'application/pdf' };
/** { ext, type } for an allowed file, or null. */
function receiptKind(file) {
  let ext = Object.keys(RECEIPT_TYPE_OF).find(k => k !== 'jpeg' && RECEIPT_TYPE_OF[k] === file.type);
  if (!ext && !file.type) {                     // some phones give no type: go by the file name
    const m = /\.([a-z0-9]+)$/i.exec(file.name || '');
    const fromName = m ? m[1].toLowerCase() : '';
    if (RECEIPT_TYPE_OF[fromName]) ext = fromName === 'jpeg' ? 'jpg' : fromName;
  }
  return ext ? { ext, type: RECEIPT_TYPE_OF[ext] } : null;
}
/** Make a large phone photo smaller before sending it. Returns a JPEG blob, or null if the picture cannot be read. */
function shrinkPhoto(file, maxSide = 1800) {
  return new Promise(resolve => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onerror = () => { URL.revokeObjectURL(url); resolve(null); };
    img.onload = () => {
      try {
        const scale = Math.min(1, maxSide / Math.max(img.naturalWidth, img.naturalHeight));
        const canvas = document.createElement('canvas');
        canvas.width = Math.max(1, Math.round(img.naturalWidth * scale));
        canvas.height = Math.max(1, Math.round(img.naturalHeight * scale));
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#fff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        canvas.toBlob(blob => { URL.revokeObjectURL(url); resolve(blob); }, 'image/jpeg', 0.85);
      } catch (e) {
        URL.revokeObjectURL(url);
        resolve(null);
      }
    };
    img.src = url;
  });
}
function receiptUploadBlock(o) {
  if (!o.can_upload_receipt) return '';         // decided by the database: unpaid and not cancelled
  const sent = !!o.payment_receipt_uploaded_at;
  const rejected = o.payment_status === 'rejected';
  const status = rejected
    ? `<p class="notice notice--error" role="alert"><strong>Payment not verified.</strong> The seller could not verify your payment. Please upload a new payment receipt.</p>`
    : sent
      ? `<p class="notice notice--success" role="status" id="receipt-submitted"><strong>Receipt submitted</strong><br>Awaiting seller verification · sent ${fmtDate(o.payment_receipt_uploaded_at)}</p>`
      : `<p class="muted" style="margin-bottom:12px">After you have paid, upload your payment receipt here so the seller can verify it.</p>`;
  const main = rejected || !sent;
  return `
    <div class="group" id="receipt-group">
      <div class="group__title"><span>Payment Receipt</span></div>
      ${status}
      <label class="btn ${main ? 'btn--primary' : 'btn--ghost'} btn--block" id="receipt-pick">${icon('upload')}
        <span>${main ? 'UPLOAD PAYMENT RECEIPT' : 'UPLOAD A DIFFERENT RECEIPT'}</span>
        <input class="sr-only" type="file" id="receipt-file" accept="image/jpeg,image/png,image/webp,application/pdf"></label>
      <p class="sheet__note">JPG, PNG, WEBP or PDF · up to 5 MB</p>
    </div>`;
}
function setReceiptBusy(busy) {
  state.receiptBusy = busy;
  const pick = $('#receipt-pick');
  if (!pick) return;
  pick.classList.toggle('is-busy', busy);
  if (busy) { pick.dataset.label = $('span', pick).textContent; $('span', pick).textContent = 'UPLOADING…'; }
  else if (pick.dataset.label) $('span', pick).textContent = pick.dataset.label;
  $('input', pick).disabled = busy;
}
/** Show the order again after something about it changed. */
function showLookupOrder(order) {
  if (!state.lookup || !$('#lookup-result')) return;
  state.lookup.order = order;
  $('#lookup-result').innerHTML = orderStatusHtml(order);
}
async function uploadReceipt(input) {
  const file = input.files && input.files[0];
  input.value = '';                             // so the same file can be chosen again after an error
  const look = state.lookup;
  if (!file || !look || state.receiptBusy) return;

  let kind = receiptKind(file);
  if (!kind) return toast('Please choose a JPG, PNG, WEBP or PDF file.', 'error');
  if (!file.size) return toast('This file is empty. Please choose another one.', 'error');
  setReceiptBusy(true);
  let body = file;
  // Phone photos are often 3–8 MB: make a big picture smaller first. A PDF is sent as it is.
  if (kind.ext !== 'pdf' && file.size > 1024 * 1024) {
    const small = await shrinkPhoto(file);
    if (small && small.size < file.size) { body = small; kind = { ext: 'jpg', type: 'image/jpeg' }; }
  }
  if (body.size > RECEIPT_MAX_BYTES) {
    setReceiptBusy(false);
    return toast('This file is larger than 5 MB. Please choose a smaller file.', 'error');
  }

  try {
    const slot = await sb.rpc('request_receipt_upload', { p_order_number: look.number, p_phone: look.phone, p_extension: kind.ext });
    if (slot.error) throw slot.error;
    const sent = await sb.storage.from('payment-receipts').upload(slot.data.path, body, { contentType: kind.type, upsert: false });
    if (sent.error) throw Object.assign(new Error(sent.error.message || 'Upload failed'), { fromStorage: true });
    const done = await sb.rpc('submit_payment_receipt', { p_order_number: look.number, p_phone: look.phone, p_path: slot.data.path });
    if (done.error) throw done.error;
    state.receiptBusy = false;
    if (state.lookup === look) {
      showLookupOrder(done.data);
      $('#receipt-group')?.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
    toast('Receipt submitted', 'success');
  } catch (error) {
    setReceiptBusy(false);
    // P0001 = a message written for customers by the database (order paid meanwhile, too many uploads, ...)
    const friendly = error && error.code === 'P0001';
    if (!friendly) console.error(error);
    const text = String(error && error.message || '');
    toast(friendly ? text
      : error.fromStorage && /size|large/i.test(text) ? 'This file is larger than 5 MB. Please choose a smaller file.'
      : error.fromStorage && /mime|type/i.test(text) ? 'Please choose a JPG, PNG, WEBP or PDF file.'
      : 'We could not upload your receipt. Check your connection and try again, or send it to the seller on WhatsApp.', 'error');
    if (friendly) {
      // The order probably changed (e.g. the seller just confirmed the payment): show it as it is now
      const fresh = await sb.rpc('get_order_status', { p_order_number: look.number, p_phone: look.phone });
      if (!fresh.error && fresh.data && state.lookup === look) showLookupOrder(fresh.data);
    }
  }
}

  'clear-filter': () => { state.filter = { group: 'all', type: 'all', category: 'all', stage: 'all', q: '' }; $('#search').value = ''; renderCatalog(); },

  'gallery-go': el => galleryGo(Number(el.dataset.index)),
  'detail-qty': el => { state.detail.qty += Number(el.dataset.dir); syncDetailQty(); },
  'add-to-cart': () => addToCart(),

  },
  'cart-remove': el => {
    state.cart = state.cart.filter(l => l.id !== el.dataset.id);
    saveCart();
    refreshCartSheet();
  },
  'checkout-cart': () => {
    tidyCart();
    if (!state.cart.length) return refreshCartSheet();
    closeSheet('cart-sheet', true);
    openCheckout(state.cart.map(l => ({ ...l })), true);
  },
  'confirm-order': el => confirmOrder(el),
  'copy-account': el => copyText(el.dataset.value),
  'open-orders': () => openOrders(),
  'upload-after-order': () => { closeSheet('success-sheet', true); openOrders(true); },
  'view-receipt': () => openBuyerReceipt(),
  'print-receipt': () => printBuyerReceipt()
};

document.addEventListener('click', event => {
  const el = event.target.closest('[data-action]');
  if (!el || el.disabled) return;
  const handler = actions[el.dataset.action];
  if (handler) handler(el, event);
});
document.addEventListener('submit', event => {
  event.preventDefault();
  if (event.target.id === 'lookup-form') lookupOrder(event.target);
  else if (event.target.id === 'checkout-form') confirmOrder($('#confirm-order'));
});
document.addEventListener('input', event => {
  const el = event.target;
  if (el.id === 'search') { state.filter.q = el.value; renderCatalog(); }
  if (el.name === 'postcode') el.value = el.value.replace(/\D/g, '').slice(0, 5);
  el.closest('.field.has-error')?.classList.remove('has-error');     // clear the error once they start fixing it
});
document.addEventListener('change', event => {
  const el = event.target;
  if (el.id === 'receipt-file') return uploadReceipt(el);
  if (el.name === 'zone' && el.form?.id === 'checkout-form') {
    state.checkout.zoneId = el.value;
    $('#zone-choices').classList.remove('has-error');
    $('#zone-error').style.display = '';
    refreshCheckoutTotals();                    // total updates the moment a region is picked
  }
  el.closest('.field.has-error')?.classList.remove('has-error');
});
document.addEventListener('keydown', event => {
  if (event.key !== 'Escape') return;
  const sheets = $$('#sheet-root > .sheet');
  if (sheets.length) closeSheet(sheets[sheets.length - 1]);
  else closeFilters();
});

async function start() {
  if (SUPABASE_URL.startsWith('YOUR_') || SUPABASE_ANON_KEY.startsWith('YOUR_')) {
    return renderProblem('This store is not connected yet',
      'Open <code>index.html</code> and replace <code>YOUR_SUPABASE_URL</code> and <code>YOUR_SUPABASE_ANON_KEY</code> at the very top.', false);
  }
  if (isSecretKey(SUPABASE_ANON_KEY)) {
    return renderProblem('Wrong key — this store will not start', 'This file contains a Supabase <strong>service_role / secret key</strong>. Remove it now and use the anon / publishable key instead. Then create a new secret key in Supabase &gt; Project Settings &gt; API, because the old one may already have been seen.', false);
  }
  if (!window.supabase) return renderProblem('Could not load the store', 'Check your internet connection and try again.');
  // No login on the storefront, so no session is kept here.
  if (!sb) sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { persistSession: false, autoRefreshToken: false } });
  renderLoading();
  try {
    await loadEverything();
  } catch (error) {
    console.error(error);
    return renderProblem('Could not load the store', 'Check your internet connection and try again.');
  }
  state.cart = readCart();           // ids + quantities only
  tidyCart();                        // keep only physical products that can be bought right now
  writeStore(CART_KEY, state.cart);  // the saved cart never keeps anything but { id, qty }
  renderPage();
  openDeepLink();                    // ?p=<slug> -> open that product's details
}
start();
</script>
</body>
</html>
