/* The three images of the Store tab. folder = where the file goes inside the bucket "store-assets". */
const ASSETS = {
  logo:       { label: 'Logo',       folder: 'logo',       maxSide: 512,  keepAlpha: true,  cls: '',
                hint: 'Square image works best.' },
  banner:     { label: 'Banner',     folder: 'banner',     maxSide: 1600, keepAlpha: false, cls: 'asset__preview--banner',
                hint: 'Wide image, about 1600 × 800.' },
  payment_qr: { label: 'Payment QR', folder: 'payment-qr', maxSide: 1200, keepAlpha: true,  cls: 'asset__preview--qr',
                hint: 'The QR image from your banking app (e.g. DuitNow QR). Shown to customers after they place an order, together with your bank details — when “Show Payment QR” below is ON.' }
};
/*
 * Images uploaded on the Store tab that are NOT saved yet. An upload goes to
 * Storage straight away, but it only becomes the store's logo / banner / QR
 * when "Save store settings" is pressed. If the seller removes it, replaces it
 * again or leaves the tab before saving, the file would be left behind in
 * Storage — so it is deleted here.
 * Only files uploaded in THIS visit are ever in this list, and storagePath()
 * still has the last word: a link that is not a file of this project's
 * "store-assets" bucket is never deleted. The image that is already saved is
 * never touched here (it is only replaced after a successful Save).
 */
const pendingAssets = new Set();
/** Delete unsaved uploads from Storage. only = just this link; keep = links that are saved and must stay. */
function dropPendingAssets({ only = null, keep = [] } = {}) {
  const paths = [];
  [...pendingAssets].forEach(url => {
    if (only !== null && url !== only) return;
    pendingAssets.delete(url);
    if (keep.includes(url)) return;                       // it has been saved: it is the store's image now
    const path = storagePath('store-assets', url);        // null unless it is a file of this project
    if (path) paths.push(path);
  });
  return paths.length ? sb.storage.from('store-assets').remove(paths).catch(() => {}) : Promise.resolve();
}
function assetBlock(kind, url) {
  const a = ASSETS[kind];
  return `
    <div class="field">
      <span class="field__label">${a.label}</span>
      <div class="asset">
        <div class="asset__preview ${a.cls}" id="${kind}-preview">${url ? `<img src="${esc(url)}" alt="">` : icon('image')}</div>
        <div class="asset__actions">
          <label class="btn btn--ghost btn--sm">${url ? (kind === 'payment_qr' ? 'Replace' : 'Change') : 'Upload'}
            <input class="sr-only" type="file" accept="image/*" data-asset="${kind}"></label>
          ${url ? `<button type="button" class="btn btn--ghost btn--sm" data-action="asset-remove" data-kind="${kind}">Remove</button>` : ''}
        </div>
      </div>
      <input type="hidden" name="${kind}_url" value="${esc(url || '')}">
      <span class="field__hint">${a.hint}</span>
    </div>`;
}
function renderStore() {
  const s = state.settings || {};
  // The form is rebuilt from what is saved, so an upload that was never saved is gone from it.
  dropPendingAssets({ keep: [s.logo_url, s.banner_url, s.payment_qr_url] });
  $('#page').innerHTML = `
    <div class="page-head"><div><h1>Store</h1><p>What customers see, and how they pay you</p></div></div>
    <form id="store-form" novalidate>
      <div class="group">
        <div class="group__title">Order status</div>
        <div class="choices choices--2">
          <label class="choice"><input type="radio" name="order_status" value="open" ${s.order_status !== 'closed' ? 'checked' : ''}>
            <span class="choice__box"><i class="choice__dot"></i><span>Open<small>Taking orders</small></span></span></label>
          <label class="choice"><input type="radio" name="order_status" value="closed" ${s.order_status === 'closed' ? 'checked' : ''}>
            <span class="choice__box"><i class="choice__dot"></i><span>Closed<small>Checkout is off</small></span></span></label>
        </div>
      </div>

      <div class="group">
        <div class="group__title">Store profile</div>
        <label class="field" data-field="store_name"><span class="field__label">Store Name <span class="req">*</span></span>
          <input class="input" name="store_name" maxlength="80" value="${esc(s.store_name || '')}">
          <span class="field__error">Enter a store name.</span></label>
        <label class="field"><span class="field__label">Store Description</span>
          <textarea class="input" name="store_description" rows="3" maxlength="400">${esc(s.store_description || '')}</textarea></label>
        <label class="field"><span class="field__label">Store Announcement</span>
          <textarea class="input" name="announcement" rows="2" maxlength="300" placeholder="e.g. Order minggu ini dipos Isnin depan">${esc(s.announcement || '')}</textarea>
          <span class="field__hint">Shown at the top of your storefront. Leave empty to hide.</span></label>
        ${assetBlock('logo', s.logo_url)}
        ${assetBlock('banner', s.banner_url)}
      </div>

      <div class="group">
        <div class="group__title">Contact &amp; payment</div>
        <label class="field" data-field="whatsapp_number"><span class="field__label">WhatsApp Number</span>
          <input class="input" name="whatsapp_number" type="tel" inputmode="tel" maxlength="20" value="${esc(s.whatsapp_number || '')}" placeholder="e.g. 0123456789">
          <span class="field__error">Enter a valid phone number.</span>
          <span class="field__hint">Customers can ask questions and send their payment proof here.</span></label>
        <label class="field"><span class="field__label">Bank Name</span>
          <input class="input" name="bank_name" maxlength="60" value="${esc(s.bank_name || '')}" placeholder="e.g. Maybank"></label>
        <label class="field"><span class="field__label">Bank Account Name</span>
          <input class="input" name="bank_account_name" maxlength="100" value="${esc(s.bank_account_name || '')}"></label>
        <label class="field"><span class="field__label">Bank Account Number</span>
          <input class="input num" name="bank_account_number" inputmode="numeric" maxlength="30" value="${esc(s.bank_account_number || '')}">
          <span class="field__hint">Only shown to customers after they place an order.</span></label>
        ${assetBlock('payment_qr', s.payment_qr_url)}
        <label class="toggle" style="margin-top:16px">
          <span class="toggle__text"><strong>Show Payment QR</strong><span id="qr-toggle-hint"></span></span>
          <span class="switch"><input type="checkbox" name="show_payment_qr" ${s.show_payment_qr ? 'checked' : ''}><i></i></span>
        </label>
      </div>
      <button class="btn btn--primary btn--block" type="submit">SAVE STORE SETTINGS</button>
    </form>

    <h2 class="section-title">Shipping settings</h2>
    <div class="card card--pad">
      <div id="zone-list">${zoneRows()}</div>
      <button class="btn btn--ghost btn--block" style="margin-top:12px" data-action="edit-zone">${icon('plus')} Add shipping zone</button>
    </div>`;
  renderQrToggleHint();
}
/** One line under "Show Payment QR" that says what customers will see with the form as it is now. */
function renderQrToggleHint() {
  const form = $('#store-form');
  const hint = $('#qr-toggle-hint');
  if (!form || !hint) return;
  const on = form.show_payment_qr.checked;
  const hasQr = !!form.payment_qr_url.value;
  hint.textContent = on && hasQr ? 'ON — customers see your QR with the bank details after they place an order.'
    : on ? 'ON, but there is no QR image yet — customers see the bank details only.'
    : hasQr ? 'OFF — the QR is hidden from customers. The image stays saved here.'
    : 'OFF — customers see the bank details only.';
}
function zoneRows() {
  if (!state.zones.length) return `<div class="empty">${icon('truck')}<strong>No shipping zones</strong><span>Customers cannot check out until you add one.</span></div>`;
  return state.zones.map(z => `
    <div class="zone">
      <div class="zone__main"><strong>${esc(z.name)}</strong> <span class="muted">${esc(z.code)}</span><br>
        <span class="badge ${z.is_active ? 'badge--mint' : 'badge--grey'}">${z.is_active ? 'Active' : 'Inactive'}</span></div>
      <span class="zone__fee num">${money(z.fee)}</span>
      <button class="icon-btn" data-action="edit-zone" data-id="${z.id}" aria-label="Edit ${esc(z.name)}">${icon('edit')}</button>
    </div>`).join('');
}
async function handleAssetPick(input) {
  const kind = input.dataset.asset;
  const file = input.files[0];
  if (!file) return;
  const label = input.closest('label');
  const original = label.firstChild.textContent;
  label.firstChild.textContent = 'Uploading… ';
  try {
    const a = ASSETS[kind];
    // The payment QR gets a long random name: its link is only given to customers who placed an order.
    const name = kind !== 'payment_qr' ? randomId() : window.crypto?.randomUUID ? crypto.randomUUID() : randomId() + randomId();
    const url = await uploadImage('store-assets', `${a.folder}/${name}`, file, a.maxSide, a.keepAlpha);
    // If the image being replaced was itself an unsaved upload, delete that file now.
    dropPendingAssets({ only: $('#store-form')?.[`${kind}_url`]?.value || '' });
    pendingAssets.add(url);
    // Redraw this image block: preview + Change / Replace + Remove
    input.closest('.field').outerHTML = assetBlock(kind, url);
    renderQrToggleHint();
    toast('Uploaded. Press “Save store settings” to keep it.', 'success');
  } catch (error) {
    console.error(error);
    toast(errMsg(error), 'error');
  } finally {
    label.firstChild.textContent = original;
    input.value = '';
  }
}
async function saveStore(form) {
  const wa = form.whatsapp_number.value.trim();
  const waDigits = wa.replace(/\D/g, '');
  const problems = [
    setFieldError(form, 'store_name', !form.store_name.value.trim()),
    setFieldError(form, 'whatsapp_number', wa !== '' && (waDigits.length < 9 || waDigits.length > 13))
  ];
  if (problems.some(Boolean)) {
    $('.field.has-error', form).scrollIntoView({ behavior: 'smooth', block: 'center' });
    return toast('Please fix the highlighted fields.', 'error');
  }
  const text = name => form[name].value.trim() || null;
  const row = {
    store_name: form.store_name.value.trim(),
    store_description: text('store_description'),
    announcement: text('announcement'),
    logo_url: text('logo_url'),
    banner_url: text('banner_url'),
    whatsapp_number: wa || null,
    bank_name: text('bank_name'),
    bank_account_name: text('bank_account_name'),
    bank_account_number: text('bank_account_number'),
    payment_qr_url: text('payment_qr_url'),
    show_payment_qr: form.show_payment_qr.checked,        // OFF hides the QR; the image is kept
    order_status: form.order_status.value
  };
  const btn = $('button[type=submit]', form);
  const previous = state.settings || {};
  setBusy(btn, true, 'Saving…');
  try {
    const query = previous.id
      ? sb.from('store_settings').update(row).eq('id', previous.id).select().single()
      : sb.from('store_settings').insert(row).select().single();
    const { data, error } = await query;
    if (error) throw error;
    state.settings = data;
    // Tidy up replaced logo / banner / payment QR files (best effort)
    const stale = ['logo_url', 'banner_url', 'payment_qr_url']
      .filter(k => previous[k] && previous[k] !== data[k])
      .map(k => storagePath('store-assets', previous[k])).filter(Boolean);
    if (stale.length) sb.storage.from('store-assets').remove(stale);
    toast('Store settings saved', 'success');
    renderStore();
  } catch (error) {
    console.error(error);
    setBusy(btn, false);
    toast(errMsg(error), 'error');
  }
}
function openZoneEditor(id) {
  const z = state.zones.find(x => x.id === id) || { is_active: true };
  openSheet({
    id: 'zone-sheet',
    title: z.id ? 'Edit shipping zone' : 'Add shipping zone',
    subtitle: 'The fee is added to the order at checkout',
    body: `
      <form id="zone-form" data-id="${z.id || ''}" novalidate>
        <label class="field" data-field="name"><span class="field__label">Shipping Zone <span class="req">*</span></span>
          <input class="input" name="name" maxlength="60" value="${esc(z.name || '')}" placeholder="e.g. Semenanjung Malaysia">
          <span class="field__error">Enter a zone name.</span></label>
        <div class="row-2">
          <label class="field" data-field="code"><span class="field__label">Short code <span class="req">*</span></span>
            <input class="input" name="code" maxlength="8" value="${esc(z.code || '')}" placeholder="e.g. SM" autocapitalize="characters">
            <span class="field__error">Enter a short code.</span></label>
          <label class="field" data-field="fee"><span class="field__label">Fee (RM) <span class="req">*</span></span>
            <input class="input num" name="fee" inputmode="decimal" value="${esc(z.fee ?? '')}" placeholder="0.00">
            <span class="field__error">Enter a fee.</span></label>
        </div>
        <label class="toggle">
          <span class="toggle__text"><strong>Active</strong><span>Customers can choose this zone at checkout.</span></span>
          <span class="switch"><input type="checkbox" name="is_active" ${z.is_active ? 'checked' : ''}><i></i></span>
        </label>
      </form>`,
    footer: `<button class="btn btn--ghost" data-action="close-sheet">Cancel</button>
             <button class="btn btn--primary" data-action="save-zone">SAVE ZONE</button>`
  });
}
async function saveZone(btn) {
  const form = $('#zone-form');
  const fee = parseMoney(form.fee.value);
  const code = form.code.value.trim().toUpperCase();
  const problems = [
    setFieldError(form, 'name', !form.name.value.trim()),
    setFieldError(form, 'code', !code),
    setFieldError(form, 'fee', fee === null)
  ];
  if (problems.some(Boolean)) return;
  const row = { name: form.name.value.trim(), code, fee, is_active: form.is_active.checked };
  const id = form.dataset.id;
  if (!id) row.sort_order = state.zones.reduce((max, z) => Math.max(max, z.sort_order), 0) + 1;
  setBusy(btn, true, 'Saving…');
  try {
    const { error } = id
      ? await sb.from('shipping_zones').update(row).eq('id', id)
      : await sb.from('shipping_zones').insert(row);
    if (error) throw error;
    await loadZones();
    closeSheet('zone-sheet');
    toast('Shipping zone saved', 'success');
    if (state.tab === 'store') $('#zone-list').innerHTML = zoneRows();
  } catch (error) {
    console.error(error);
    setBusy(btn, false);
    toast(error.code === '23505' ? 'Another zone already uses this short code.' : errMsg(error), 'error');
  }
}

/* ---------- 9. Account ---------- */
function showAccount() {
  $('#page').innerHTML = `
    <div class="page-head"><div><h1>Account</h1><p>Your admin login</p></div></div>
    <div class="group">
      <div class="kv"><span>Admin email</span><span>${esc(state.user?.email || '')}</span></div>
    </div>
    <form class="group" id="password-form" novalidate>
      <div class="group__title">Change password</div>
      <label class="field" data-field="password"><span class="field__label">New password</span>
        <input class="input" type="password" name="password" autocomplete="new-password" minlength="8">
        <span class="field__error">Use at least 8 characters.</span></label>
      <label class="field" data-field="confirm"><span class="field__label">Repeat new password</span>
        <input class="input" type="password" name="confirm" autocomplete="new-password">
        <span class="field__error">The two passwords do not match.</span></label>
      <button class="btn btn--ghost btn--block" type="submit">CHANGE PASSWORD</button>
    </form>
    <button class="btn btn--danger btn--block" data-action="logout">${icon('logout')} LOG OUT</button>`;
}
async function changePassword(form) {
  const password = form.password.value;
  const problems = [
    setFieldError(form, 'password', password.length < 8),
    setFieldError(form, 'confirm', password !== form.confirm.value)
  ];
  if (problems.some(Boolean)) return;
  const btn = $('button[type=submit]', form);
  setBusy(btn, true, 'Saving…');
  const { error } = await sb.auth.updateUser({ password });
  setBusy(btn, false);
  if (error) return toast(errMsg(error), 'error');
  form.reset();
  toast('Password changed', 'success');
}

/* ---------- 10. Event wiring + start-up ---------- */
const actions = {
  'tab': el => showTab(el.dataset.tab),
  'close-sheet': el => closeSheet(el.closest('.sheet')),
  'go-orders': el => { state.orderFilter = el.dataset.filter; showTab('orders'); },
  'logout': () => logout(),

  'add-product': () => openProductEditor(),
  'edit-product': el => openProductEditor((state.products || []).find(p => p.id === el.dataset.id)),
  'delete-product': el => deleteProduct(el.dataset.id),
  'product-status': el => { state.productFilter.status = el.dataset.value; renderProducts(); },
  'save-product': el => saveProduct(el),
  'img-move': el => {
    const ed = state.editor, i = Number(el.dataset.index), j = i + Number(el.dataset.dir);
    if (j < 0 || j >= ed.images.length) return;
    [ed.images[i], ed.images[j]] = [ed.images[j], ed.images[i]];
    renderEditorImages();
  },
  'img-remove': el => {
    const ed = state.editor;
    const [img] = ed.images.splice(Number(el.dataset.index), 1);
    if (img.id) ed.removed.push(img); else URL.revokeObjectURL(img.url);
    renderEditorImages();
  },

  'order-filter': el => { state.orderFilter = el.dataset.value; showOrders(); },
  'more-orders': async el => {
    setBusy(el, true, 'Loading…');
    try { await loadOrders(true); renderOrders(); }
    catch (error) { setBusy(el, false); toast(errMsg(error), 'error'); }
  },
  'open-order': el => openOrder(el.dataset.id),
  'set-payment': el => setPayment(el),
  'update-order': el => updateOrder(el),
  'cancel-order': el => cancelOrder(el),

  'asset-remove': el => {
    // Removing an unsaved upload deletes its file now. A saved image stays until "Save store settings".
    dropPendingAssets({ only: $('#store-form')?.[`${el.dataset.kind}_url`]?.value || '' });
    el.closest('.field').outerHTML = assetBlock(el.dataset.kind, '');
    renderQrToggleHint();
    toast('Removed. Press “Save store settings” to confirm.');
  },
  'edit-zone': el => openZoneEditor(el.dataset.id),
  'save-zone': el => saveZone(el)
};

document.addEventListener('click', event => {
  const el = event.target.closest('[data-action]');
  if (!el || el.disabled) return;
  const handler = actions[el.dataset.action];
  if (handler) handler(el, event);
});
document.addEventListener('submit', event => {
  event.preventDefault();
  const form = event.target;
  if (form.id === 'login-form') handleLogin(form);
  else if (form.id === 'store-form') saveStore(form);
  else if (form.id === 'password-form') changePassword(form);
  else if (form.id === 'product-form') saveProduct($('#save-product-btn'));
});
document.addEventListener('input', event => {
  const el = event.target;
  if (el.id === 'product-search') { state.productFilter.q = el.value; renderProductList(); }
  else if (el.form?.id === 'product-form' && ['price', 'cost_price', 'stock_quantity'].includes(el.name)) renderProfit();
  // Clear a field's error as soon as the user starts fixing it
  el.closest('.field.has-error')?.classList.remove('has-error');
});
document.addEventListener('change', event => {
  const el = event.target;
  if (el.id === 'product-category') { state.productFilter.category = el.value; renderProductList(); }
  else if (el.id === 'img-input') { addEditorImages(el.files); el.value = ''; }
  else if (el.name === 'product_type' && el.form?.id === 'product-form') { applyProductType(); renderProfit(); }
  else if (el.name === 'digital_action' && el.form?.id === 'product-form') applyProductType();
  else if (el.name === 'category_id' && el.form?.id === 'product-form') {
    applyCategoryChoice();
    if (el.value === OTHER_CATEGORY) el.form.category_custom.focus();
  }
  else if (el.dataset.asset) handleAssetPick(el);
  else if (el.name === 'show_payment_qr') renderQrToggleHint();
});
/* Product order: the handle starts a drag; the page follows the pointer wherever it goes. */
document.addEventListener('pointerdown', event => {
  const handle = event.target.closest?.('[data-drag-handle]');
  if (!handle || handle.disabled) return;
  if (event.pointerType === 'mouse' && event.button !== 0) return;   // left button only
  startProductDrag(handle, event);
});
document.addEventListener('pointermove', event => {
  if (!sorting || event.pointerId !== sorting.pointerId) return;
  sorting.clientY = event.clientY;
  moveProductDrag();
});
document.addEventListener('pointerup', event => {
  if (!sorting || event.pointerId !== sorting.pointerId) return;
  sorting.clientY = event.clientY;
  moveProductDrag();
  endProductDrag(true);
});
document.addEventListener('pointercancel', event => {
  if (sorting && event.pointerId === sorting.pointerId) endProductDrag(false);
});
window.addEventListener('blur', () => endProductDrag(false));
// A phone's address bar hiding or showing changes the HEIGHT of the window while the
// page scrolls: that must not stop a drag. Only a change of width does (the phone was turned).
window.addEventListener('resize', () => { if (sorting && window.innerWidth !== sorting.width) endProductDrag(false); });
// The page was scrolled during a drag (mouse wheel, keyboard): keep the card under the pointer.
window.addEventListener('scroll', () => { if (sorting) moveProductDrag(); }, { passive: true });
// A long press on the handle (touch) must not open the browser's menu.
document.addEventListener('contextmenu', event => {
  if (event.target.closest?.('[data-drag-handle]')) event.preventDefault();
});
document.addEventListener('keydown', event => {
  if (sorting && event.key === 'Escape') return endProductDrag(false);
  const handle = event.target.closest?.('[data-drag-handle]');
  if (handle && !handle.disabled && (event.key === 'ArrowUp' || event.key === 'ArrowDown')) {
    event.preventDefault();
    return moveProductByKey(handle.dataset.id, event.key === 'ArrowUp' ? -1 : 1);
  }
  if (event.key !== 'Escape') return;
  const sheets = $$('#sheet-root > .sheet:not(.sheet--dialog)');
  if (sheets.length && !$('#sheet-root > .sheet--dialog')) closeSheet(sheets[sheets.length - 1]);
});

(async function start() {
  if (SUPABASE_URL.startsWith('YOUR_') || SUPABASE_ANON_KEY.startsWith('YOUR_')) return renderSetupNeeded();
  if (isSecretKey(SUPABASE_ANON_KEY)) {
    $('#app').innerHTML = `<div class="login"><div class="card login__card"><div class="login__mark">!</div><h1>Wrong key</h1><p>This page will not start.</p>
      <div class="notice notice--error" role="alert">This file contains a Supabase <strong>service_role / secret key</strong>. Remove it now and use the anon / publishable key instead. Then create a new secret key in Supabase &gt; Project Settings &gt; API, because the old one may already have been seen.</div></div></div>`;
    return;
  }
  if (!window.supabase) {
    $('#app').innerHTML = `<div class="login"><div class="card login__card"><h1>Could not load</h1><p>Check your internet connection and refresh this page.</p></div></div>`;
    return;
  }
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  // If the session expires or is signed out in another tab, go back to the login page.
  sb.auth.onAuthStateChange(event => {
    if (event === 'SIGNED_OUT' && state.user) { state.user = null; renderLogin('You have been signed out.'); }
  });
  const { data } = await sb.auth.getSession();
  if (data?.session?.user) await enterApp(data.session.user);
  else renderLogin();
})();
</script>
